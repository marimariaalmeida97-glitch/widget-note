<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê de Mundos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Source+Serif+4:wght@400;600&family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* ===== DESIGN SYSTEM: SCRIBE & STRUT MINIMALIST UI ===== */
:root {
  --bg: #F6F6F4;
  --panel: #FFFFFF;
  --ink: #18181B;
  --muted: #71717A;
  --accent: #5E5CE6;
  --line: #E6E6E3;
  --bad: #E11D48;
  --fh: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --fb: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 22px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --panel: #1A1A1E;
    --ink: #F4F4F5;
    --muted: #A1A1AA;
    --accent: #7D7AFF;
    --line: #27272A;
    --bad: #FB7185;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.2);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #111113;
  --panel: #1A1A1E;
  --ink: #F4F4F5;
  --muted: #A1A1AA;
  --accent: #7D7AFF;
  --line: #27272A;
  --bad: #FB7185;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 90px);
}

* { box-sizing: border-box; }

body, body :not(h1):not(h2):not(h3):not(.t b) {
  font-family: var(--fb);
}

h1, h2, h3, .infobox .t b {
  font-family: var(--fh) !important;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.65;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--panel);
  z-index: 40;
}

/* Typography Hierarchy */
h1, h2, h3 {
  letter-spacing: -0.03em;
  line-height: 1.25;
  color: var(--ink);
  margin: 0.2em 0;
}
h2 {
  font-size: clamp(1.45rem, 2.2vw, 1.85rem);
  font-weight: 700;
  margin: 0 0 0.75rem 0;
}
h3 {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0.25rem 0 0.5rem 0;
}
.small {
  font-size: 0.8125rem;
  color: var(--muted);
  line-height: 1.5;
}

/* Top Bar & Glassmorphism Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: color-mix(in srgb, var(--panel) 84%, transparent);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
}

header {
  max-width: 1480px;
  margin: 0 auto;
  padding: 0.65rem clamp(1rem, 2.5vw, 2rem);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem 1rem;
}

header h1 {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin: 0;
}

header h1::before {
  content: "✦";
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--panel);
  font-size: 13px;
  box-shadow: var(--shadow-xs);
}

#pname {
  margin-right: auto;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.2rem 0.65rem;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  border-radius: 999px;
  color: var(--muted);
}

#pname:empty { display: none; }

/* Navigation Pill Bar (Scribe / Strut style) */
nav {
  display: flex;
  gap: 0.2rem;
  padding: 0.22rem;
  background: color-mix(in srgb, var(--ink) 4%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  border-radius: 11px;
  overflow-x: auto;
  max-width: 100%;
}

nav button {
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  background: transparent;
  border: 0 !important;
  border-radius: 8px;
  color: var(--muted);
  padding: 0.38rem 0.72rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

nav button:hover {
  color: var(--ink);
}

nav button[aria-selected="true"] {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* Floating Action Toolbar (Scribe Editor Style) */
#tb {
  max-width: 880px;
  margin: 0.45rem auto;
  padding: 0.35rem 0.65rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  align-items: center;
  justify-content: center;
}

#tb button, #tb select, #tb input {
  font: inherit;
  font-size: 0.8rem;
  font-weight: 500;
  min-width: 32px;
  height: 30px;
  background: transparent;
  color: var(--ink);
  border: 1px solid transparent;
  border-radius: 7px;
  cursor: pointer;
  padding: 0 0.5rem;
  transition: background 0.14s, border-color 0.14s;
}

#tb button:hover, #tb select:hover {
  background: var(--bg);
  border-color: var(--line);
}

#tb select {
  background: var(--bg);
  border-color: var(--line);
  padding: 0 0.4rem;
}

#tb input[type="color"] {
  padding: 2px;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--bg);
}

#tb .sep {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 0.25rem;
}

/* Header Collapse Toggle */
.top.app-header-collapsed header { display: none; }
.top.app-header-collapsed { background: transparent; border-bottom: 0; backdrop-filter: none; }
.header-reveal {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 0.6rem);
  left: 0.8rem;
  z-index: 50;
  padding: 0.38rem 0.75rem;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  cursor: pointer;
}
.header-reveal:hover { border-color: var(--accent); color: var(--accent); }
#headerToggle, #bk { font-size: 0.8rem; padding: 0.35rem 0.7rem; border-radius: 8px; white-space: nowrap; }

/* Main Container & Layout */
main {
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(1.2rem, 2.5vw, 2.2rem) clamp(1rem, 2.5vw, 2rem) 5rem;
}

.row {
  display: flex;
  gap: 1.5rem;
  align-items: flex-start;
  flex-wrap: wrap;
}

.grow {
  flex: 1;
  min-width: 280px;
}

/* Left Workspace Sidebar (Strut & Scribe style) */
.side {
  width: 240px;
  flex: none;
  padding: 0.6rem;
  background: color-mix(in srgb, var(--panel) 65%, var(--bg));
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 74px);
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}

.side button {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 0.86rem;
  font-weight: 500;
  background: transparent;
  border: 0;
  border-radius: 9px;
  padding: 0.52rem 0.75rem;
  margin: 0.1rem 0;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.14s ease;
}

.side button:hover {
  background: color-mix(in srgb, var(--ink) 4%, transparent);
  color: var(--ink);
}

.side button[aria-current="true"] {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
}

.side select {
  font-size: 0.84rem;
  border-radius: 9px;
  background: var(--panel);
}

/* Buttons & Inputs */
.btn {
  font: inherit;
  font-size: 0.84rem;
  font-weight: 600;
  background: var(--ink);
  color: var(--panel);
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 0.48rem 0.95rem;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
}

.btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.btn.g {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-xs);
}

.btn.g:hover {
  background: var(--bg);
  border-color: color-mix(in srgb, var(--ink) 20%, var(--line));
}

input[type="text"], input[type="number"], input[type="password"], select, textarea {
  font: inherit;
  font-size: 0.9rem;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 0.5rem 0.7rem;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}

input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
  outline: none;
  background: var(--panel);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}

button:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Cards & Kanban Columns (Strut Board Style) */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.35rem;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
}

.proj {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap: 1rem;
  margin: 1.1rem 0 1.8rem;
}

.proj .card {
  cursor: pointer;
  text-align: left;
  position: relative;
}

.proj .card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}

.proj .card h3 {
  font-size: 1.15rem;
  margin: 0.1rem 0 0.4rem;
}

/* Badges / Tags (Pill with subtle dot aesthetic) */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.74rem;
  font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  background: color-mix(in srgb, var(--accent) 8%, var(--panel));
  color: var(--accent);
  border-radius: 999px;
  padding: 0.14rem 0.65rem;
  letter-spacing: 0.01em;
}

/* Writing Canvas (Scribe Centered Paper Sheet) */
.ed {
  min-height: 540px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 5vw, 3.8rem);
  font-size: 1.05rem;
  line-height: 1.85;
  box-shadow: var(--shadow-sm);
  outline: none;
}

#v-escrita .grow, main > .row > .grow {
  max-width: 100%;
}

/* Title inside Writing Area */
#ct {
  background: transparent !important;
  border: 0 !important;
  border-bottom: 1px solid transparent !important;
  border-radius: 0 !important;
  padding: 0.2rem 0 !important;
  font-size: clamp(1.6rem, 3vw, 2.2rem) !important;
  font-weight: 700 !important;
  letter-spacing: -0.03em;
  box-shadow: none !important;
  margin-bottom: 0.3rem;
}

#ct:focus {
  border-bottom-color: var(--line) !important;
}

.ed.sm {
  min-height: 90px;
  border-radius: var(--radius-md);
  padding: 0.85rem 1.05rem;
  font-size: 0.96rem;
  line-height: 1.7;
  box-shadow: none;
  background: var(--bg);
}

.ed.sm:focus {
  background: var(--panel);
}

.ed img, .infobox img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-sm);
}

.ed:empty::before {
  content: attr(data-ph);
  color: var(--muted);
  opacity: 0.7;
}

/* Draft / Official Segmented Switch */
.vt {
  display: inline-flex;
  gap: 0.2rem;
  margin: 0.6rem 0 1rem;
  padding: 0.22rem;
  background: color-mix(in srgb, var(--ink) 4%, var(--bg));
  border: 1px solid var(--line);
  border-radius: 10px;
  align-items: center;
  width: 100%;
}

.vt button[data-v] {
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 0.35rem 0.85rem;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.15s;
}

.vt button[data-v][aria-pressed="true"] {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* Mentions & Comments */
.mn {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border-bottom: 1px dashed var(--accent);
  padding: 0.05rem 0.3rem;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
}

.cm {
  background: color-mix(in srgb, #F59E0B 28%, transparent);
  border-bottom: 2px solid #F59E0B;
  padding: 0 2px;
  border-radius: 3px;
  cursor: pointer;
}

/* Floating Popovers & Context Menus (Scribe Action Menu Look) */
#pop, #cmbox, #mmenu {
  position: fixed;
  z-index: 60;
  background: color-mix(in srgb, var(--panel) 96%, transparent);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.9rem;
  box-shadow: var(--shadow-lg);
  max-width: 310px;
  font-size: 0.875rem;
  display: none;
}

#mmenu {
  padding: 0.35rem;
  max-height: 250px;
  overflow: auto;
  min-width: 220px;
}

#mmenu button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 0.85rem;
  background: none;
  border: 0;
  border-radius: 8px;
  color: var(--ink);
  padding: 0.45rem 0.65rem;
  cursor: pointer;
}

#mmenu button:hover {
  background: var(--bg);
}

#pop img {
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: 9px;
  margin-bottom: 0.4rem;
}

/* Wiki / Ficha Inspector Panel (Scribe Right Panel Style) */
.infobox {
  flex: none;
  width: 310px;
  max-width: 100%;
  margin: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  font-size: 0.86rem;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.infobox .t {
  padding: 1rem 1.1rem;
  text-align: left;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 50%, var(--panel));
}

.ph {
  height: 160px;
  margin: 0.85rem;
  display: grid;
  place-items: center;
  background: var(--bg);
  border: 1px dashed var(--line);
  color: var(--muted);
  font-size: 0.82rem;
  text-align: center;
  cursor: pointer;
  border-radius: var(--radius-md);
  padding: 1rem;
  transition: border-color 0.15s, color 0.15s;
}

.ph:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.fr {
  display: grid;
  grid-template-columns: 95px 1fr 24px;
  gap: 0.35rem;
  padding: 0.4rem 0.85rem;
  border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
  align-items: center;
}

.fr input {
  width: 100%;
  min-width: 0;
  padding: 0.25rem 0.4rem;
  font-size: 0.84rem;
  color: var(--ink);
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
}

.fr input:hover, .fr input:focus {
  border-color: var(--line);
  background: var(--bg);
}

.fr input[data-k] {
  font-weight: 600;
  color: var(--muted);
}

.fr button {
  background: none;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  opacity: 0.35;
  border-radius: 5px;
}

.fr:hover button { opacity: 1; }

.rr {
  display: grid;
  grid-template-columns: 95px 1fr;
  gap: 0.35rem;
  padding: 0.5rem 0.85rem;
  border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
  font-size: 0.84rem;
}

.rr b { color: var(--muted); font-weight: 600; }

/* Ficha Sections & Table of Contents */
.toc {
  display: inline-block;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0.75rem 1.1rem;
  font-size: 0.84rem;
  margin: 0.6rem 0 1rem;
  box-shadow: var(--shadow-xs);
}

.toc b {
  display: block;
  margin-bottom: 0.35rem;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.toc a {
  display: block;
  padding: 0.15rem 0;
}

a.lnk {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}

a.lnk:hover { text-decoration: underline; }

.sec {
  margin: 1rem 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 0.9rem 1.15rem;
  box-shadow: var(--shadow-xs);
}

.sec .h {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.sec .h input {
  font-family: var(--fh);
  font-size: 1.15rem;
  font-weight: 600;
  border: 0;
  background: transparent;
  padding: 0.2rem 0;
  flex: 1;
  min-width: 0;
}

.sec .h input:focus {
  box-shadow: none;
  border-bottom: 1px solid var(--accent);
  border-radius: 0;
}

.sec .h .sec-toggle {
  white-space: nowrap;
  font-size: 0.78rem;
  padding: 0.35rem 0.65rem;
}

.sec-body {
  padding-top: 0.65rem;
  margin-top: 0.55rem;
  border-top: 1px solid var(--line);
}

.sec-body[hidden] { display: none !important; }

.sec-body .ed.sm {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  padding: 0.35rem 0.1rem;
  min-height: 3rem;
}

[id^="s-"] { scroll-margin-top: 130px; }

/* Appearance Swatches (Scribe Right Panel Theme Cards) */
.pal {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.85rem;
}

.pal label {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 0.85rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xs);
}

.pal input[type="color"] {
  width: 100%;
  height: 40px;
  padding: 2px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  cursor: pointer;
}

/* Family Tree Canvas */
#tw {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);

$('#pc').onclick=()=>{const n=$('#pn').value.trim();if(!n)return $('#pn').focus();const p={id:uid(),name:n,mode:$('#pm').value,cm:{},ch:[{id:uid(),t:'Capítulo 1',draft:'',final:''}],es:[]};S.ps.push(p);pid=p.id;cid=p.ch[0].id;save();render()};

function rel(e){const p=P(),R={Cônjuge:[],Pais:[],Filhos:[],Irmãos:[]};(p.trees||[]).forEach(t=>{const n=t.n.find(x=>x.e===e.id);if(!n)return;const nm=id=>{const m=t.n.find(x=>x.id===id),f=m&&m.e&&p.es.find(y=>y.id===m.e);return f?`<a class="lnk" data-go="${f.id}">${esc(m.name)}</a>`:esc(m?m.name:'')};
t.l.forEach(l=>{const o=l.a===n.id?l.b:l.b===n.id?l.a:null;if(!o)return;if(l.t==='c')R.Cônjuge.push(nm(o));if(l.t==='i')R.Irmãos.push(nm(o));if(l.t==='p')(l.a===n.id?R.Filhos:R.Pais).push(nm(o))})});return Object.entries(R).filter(x=>x[1].length)}
function wouldGeoCycle(id,parentId,p){let cur=parentId,seen=new Set();while(cur){if(cur===id||seen.has(cur))return true;seen.add(cur);const x=p.es.find(q=>q.id===cur);cur=x&&x.parentGeoId}return false}
function cascadeGeoMap(p,parentId,mapId,enabled){const map=(p.mapLibrary||[]).find(x=>x.id===mapId);if(!map)return;map.geoIds=map.geoIds||[];const queue=p.es.filter(x=>x.cat==='Geografia'&&x.parentGeoId===parentId),seen=new Set();while(queue.length){const child=queue.shift();if(seen.has(child.id))continue;seen.add(child.id);if(enabled&&!map.geoIds.includes(child.id))map.geoIds.push(child.id);if(!enabled)map.geoIds=map.geoIds.filter(id=>id!==child.id);queue.push(...p.es.filter(x=>x.cat==='Geografia'&&x.parentGeoId===child.id))}}
function ficha(e){const p=P(),ap=p.ch.map((c,i)=>[i,c]).filter(([i,c])=>(c.final+c.draft).includes(`data-e="${e.id}"`)),rl=rel(e),mapLibrary=p.mapLibrary||[],geography=p.es.filter(x=>x.cat==='Geografia'),mapRefs=mapLibrary.filter(m=>(m.geoIds||[]).includes(e.id));if(e.cat==='Geografia'){e.placeType=e.placeType||'site';const oldLabels=CATS.Personagens,geoLabels=CATS.Geografia;e.f.forEach((r,i)=>{if(oldLabels.includes(r[0])&&geoLabels[i])r[0]=geoLabels[i]})}

const geoParentHTML=e.cat==='Geografia'?'<div class="geo-place-parent"><label for="geoParent"><b>Faz parte de</b><span class="small">Opcional · região dentro de um planeta, cidade dentro de um reino etc.</span></label><select id="geoParent"><option value="">Sem lugar superior</option>'+geography.filter(x=>x.id!==e.id&&!wouldGeoCycle(e.id,x.id,p)).map(x=>'<option value="'+esc(x.id)+'" '+(e.parentGeoId===x.id?'selected':'')+'>'+esc(x.name)+' · '+esc(GEO_TYPES[x.placeType]||'Lugar')+'</option>').join('')+'</select></div>':'';
const geoMetaHTML=e.cat==='Geografia'?'<section class="geo-meta-panel"><div class="geo-meta-heading"><b>Organização geográfica</b><span class="small">Classificação e posição deste lugar no seu universo.</span></div>'+placeTypeHTML+geoParentHTML+'</section>':'';
const geoFieldsHTML=e.cat==='Geografia'?'<section class="geo-fields"><div class="geo-fields-heading"><b>Características do lugar</b><span class="small">Tipo, região, clima e outros dados geográficos.</span></div><div id="fr">'+e.f.map((r,i)=>'<div class="geo-feature-row"><input class="geo-feature-key" data-k="'+i+'" value="'+esc(r[0]||'Campo')+'" aria-label="Nome da característica"><input id="geof-'+i+'" data-v="'+i+'" value="'+esc(r[1])+'" aria-label="'+esc(r[0]||'Característica geográfica')+'"><button type="button" data-d="'+i+'" title="Remover característica">×</button></div>').join('')+'</div><button class="btn g geo-add-field" id="af">＋ Adicionar característica</button></section>':'';const sideFieldsHTML=e.cat==='Geografia'?'':'<div id="fr">'+e.f.map((r,i)=>`<div class="fr"><input data-k="${i}" value="${esc(r[0])}" aria-label="Campo"><input data-v="${i}" value="${esc(r[1])}" aria-label="Valor"><button data-d="${i}" title="Remover campo">×</button></div>`).join('')+'</div>';
const geoOptions=mapLibrary.map(m=>'<div class="geo-map-option"><input type="checkbox" data-map-id="'+esc(m.id)+'" '+((m.geoIds||[]).includes(e.id)?'checked':'')+'><span><b>'+esc(m.name)+'</b><small>'+esc(MAP_TYPES[m.kind]||'Mapa')+'</small></span>'+(m.image?'<img src="'+m.image+'" alt="">':'<span class="geo-map-no-image">Sem imagem</span>')+'<button type="button" class="btn g geo-map-open" data-mapasset-go="'+esc(m.id)+'">Abrir</button></div>').join('');
const geoLinkHTML=e.cat==='Geografia'?'<details class="geo-map-disclosure"><summary>Mapas vinculados <span class="small">'+(mapRefs.length?mapRefs.length+' associado(s)':'Opcional')+'</span></summary><div class="geo-map-disclosure-body"><p class="small">Selecione os mapas em que este lugar aparece.</p><div id="geoMapLinks">'+(mapLibrary.length?geoOptions:'<div class="geo-map-empty">Nenhum mapa cadastrado.</div>')+'</div><button type="button" class="btn g geo-add-map" data-open-map-library>＋ Adicionar ou gerenciar mapas</button></div></details>':'';

${e.cat==='Geografia'?geoFieldsHTML:sideFieldsHTML}

<div class="row" style="gap:.5rem;align-items:center"><b style="font-family:var(--fh);font-size:1.2rem"><input type="number" data-ty="${e.id}" value="${e.y}" style="width:84px" aria-label="Ano"> ${esc(p.era)}</b><input type="text" data-td="${e.id}" value="${esc(e.d)}" placeholder="Momento (opcional)" style="width:160px"><input type="text" data-tt="${e.id}" value="${esc(e.t)}" aria-label="Título" style="flex:1;min-width:160px;font-weight:600"><button class="btn g" data-tdel="${e.id}" style="color:var(--bad)">Excluir</button></div>
<textarea data-tx="${e.id}" rows="2" style="width:100%;min-height:60px;margin:.5rem 0" placeholder="Descrição do evento">${esc(e.x)}</textarea>
<div class="row" style="gap:.8rem;align-items:center"><label class="small">Capítulo <select data-tc="${e.id}"><option value="">Nenhum</option>${p.ch.map((c,i)=>`<option value="${c.id}" ${c.id===e.ch?'selected':''}>${i+1}. ${esc(c.t)}</option>`).join('')}</select></label>${e.ch&&p.ch.some(c=>c.id===e.ch)?`<a class="lnk" data-ch="${e.ch}">abrir capítulo</a>`:''}<label class="small">Envolvidos <select data-tp="${e.id}"><option value="">Adicionar…</option>${p.es.filter(x=>!e.pp.includes(x.id)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>
<p style="margin:.4rem 0 0">${e.pp.map(id=>{const f=p.es.find(x=>x.id===id);return f?`<span class="tag"><a class="lnk" data-go="${f.id}">${esc(f.name)}</a> <button data-trp="${e.id}|${id}" title="Remover" style="background:none;border:0;color:var(--bad);cursor:pointer">×</button></span> `:''}).join('')}</p></div>`).join(''):'<p class="small">Nenhum evento por aqui ainda.</p>'}</div>`;
$('#era').oninput=e=>{p.era=e.target.value;save()};$('#era').onchange=linha;
$('#tfl').onchange=e=>{tf=e.target.value;linha()};
$('#ta').onclick=()=>{const t=$('#tt').value.trim();if(!t)return $('#tt').focus();p.tl.push({id:uid(),y:+$('#ty').value||0,d:'',t,x:'',ch:'',pp:tf?[tf]:[]});save();linha()};
$('#ti').onclick=()=>{p.es.filter(x=>x.cat==='Personagens').forEach(x=>{const f=x.f.find(r=>/nasc/i.test(r[0])),m=f&&String(f[1]).match(/-?\d+/),t='Nasce '+x.name;if(m&&!p.tl.some(e=>e.t===t))p.tl.push({id:uid(),y:+m[0],d:'',t,x:'',ch:'',pp:[x.id]})});save();linha()};
$('#m').oninput=e=>{if(tab!=='linha')return;const t=e.target.dataset,v=e.target.value;if(t.ty)g(t.ty).y=+v||0;if(t.td)g(t.td).d=v;if(t.tt)g(t.tt).t=v;if(t.tx)g(t.tx).x=v;if(t.ty||t.td||t.tt||t.tx)save()};
$('#m').onchange=e=>{if(tab!=='linha')return;const t=e.target.dataset,v=e.target.value;if(t.ty)linha();if(t.tc){g(t.tc).ch=v;save();linha()}if(t.tp&&v){g(t.tp).pp.push(v);save();linha()}};
$('#m').onclick=e=>{if(tab!=='linha')return;const b=e.target.closest('button');if(!b)return;const t=b.dataset;if(t.tdel&&confirm('Excluir este evento?')){p.tl=p.tl.filter(x=>x.id!==t.tdel);save();linha()}if(t.trp){const[a,c]=t.trp.split('|');g(a).pp=g(a).pp.filter(x=>x!==c);save();linha()}}}
/* quadro de resumo */
function resumo(){const p=P();p.goal=p.goal||50000;p.syn=p.syn||'';
const st=c=>words(c.final)?'Oficial':words(c.draft)?'Rascunho':'Planejado',tot=p.ch.reduce((a,c)=>a+words(c.final),0),pc=Math.min(100,Math.round(tot/p.goal*100)),big=n=>`<b style="font-size:1.7rem;font-family:var(--fh)">${n}</b><br>`;
$('#m').innerHTML=`<h2>Quadro de resumo</h2>
<div class="card"><label class="small">Sinopse da história<br><textarea id="sy" rows="4" style="width:100%;min-height:90px" placeholder="Em poucas linhas: sobre o que é esta história?">${esc(p.syn)}</textarea></label></div>
<div class="proj"><div class="card">${big(p.ch.length)}<span class="small">capítulos</span></div><div class="card">${big(tot)}<span class="small">palavras nos capítulos oficiais</span></div><div class="card">${big(p.es.length)}<span class="small">fichas</span></div><div class="card">${big((p.trees||[]).length)}<span class="small">árvores</span></div></div>
<div class="card"><label class="small">Meta da história, em palavras <input type="number" id="gl" value="${p.goal}" style="width:110px;font:inherit"></label> <span class="small">${tot} de ${p.goal} (${pc}%)</span><div style="height:8px;background:var(--line);border-radius:4px;margin-top:.5rem;overflow:hidden"><i style="display:block;height:100%;width:${pc}%;background:var(--accent)"></i></div></div>
<h3 style="margin-top:1.5rem">Quadro de Capítulos</h3><div class="row" style="gap:1rem;align-items:stretch">${[['Planejado','◌'],['Rascunho','◑'],['Oficial','●']].map(([k,ic])=>{const l=p.ch.filter(c=>st(c)===k);return `<div class="grow" style="background:color-mix(in srgb,var(--panel) 55%,var(--bg));border:1px solid var(--line);border-radius:18px;padding:.9rem"><div style="display:flex;align-items:center;gap:.45rem;margin-bottom:.75rem;padding:0 .2rem"><span style="color:var(--accent)">${ic}</span><b>${k}</b> <span class="small">${l.length}</span></div>${l.map(c=>`<div class="card" style="margin:.6rem 0;padding:1rem"><a class="lnk" style="font-weight:600;color:var(--ink);font-size:.95rem" data-ch="${c.id}" data-v="${k==='Rascunho'?'draft':'final'}">${p.ch.indexOf(c)+1}. ${esc(c.t)}</a><textarea data-sm="${c.id}" rows="2" style="width:100%;margin:.5rem 0;font-size:.83rem;border:0;background:var(--bg)" placeholder="Adicionar notas ou resumo do capítulo…">${esc(c.sum||'')}</textarea><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${words(c.final)||words(c.draft)} palavras</span><span class="small">${k}</span></div></div>`).join('')||'<p class="small" style="padding:.4rem .2rem">Nenhum capítulo nesta coluna.</p>'}</div>`}).join('')}</div>
<h3 style="margin-top:1.2rem">Fichas por categoria</h3><p class="small">${Object.keys(CATS).map(k=>`${k}: ${p.es.filter(x=>x.cat===k).length}`).join(' · ')}</p>
<h3 style="margin-top:1.4rem">Zona de perigo</h3><div class="card" id="dz"><button class="btn g" id="dp" style="color:var(--bad)">Excluir este projeto</button></div>`;
$('#dp').onclick=()=>{$('#dz').innerHTML=`<p>Excluir <b>${esc(p.name)}</b> com todos os capítulos, fichas, árvores e eventos? Isso não pode ser desfeito.</p><button class="btn" id="dy" style="background:var(--bad)">Sim, excluir tudo</button> <button class="btn g" id="dn">Cancelar</button>`;$('#dy').onclick=()=>{S.ps=S.ps.filter(x=>x!==p);pid=null;tab='escrita';save();render()};$('#dn').onclick=resumo};
$('#sy').oninput=e=>{p.syn=e.target.value;save()};
$('#gl').oninput=e=>{p.goal=+e.target.value||1;save()};$('#gl').onchange=resumo;
$('#m').oninput=e=>{if(e.target.dataset.sm){p.ch.find(c=>c.id===e.target.dataset.sm).sum=e.target.value;save()}}}
/* árvores genealógicas */
let tid=null,ns=null;
function demo(p){const f=p.es.find(x=>x.name==='Lyra Valdor');return{id:uid(),name:'Casa Valdor',bc:'',bgi:'',n:[{id:'a',x:380,y:90,name:'Aldric'},{id:'m',x:600,y:90,name:'Maren'},{id:'l',x:300,y:270,name:'Lyra Valdor',e:f?f.id:''},{id:'d',x:680,y:270,name:'Doran'},{id:'c',x:100,y:270,name:'Cael'}].map(n=>({img:'',e:'',...n})),l:[{id:'1',a:'a',b:'m',t:'c'},{id:'2',a:'a',b:'l',t:'p'},{id:'3',a:'m',b:'l',t:'p'},{id:'4',a:'a',b:'d',t:'p'},{id:'5',a:'m',b:'d',t:'p'},{id:'6',a:'l',b:'c',t:'c'},{id:'7',a:'l',b:'d',t:'i'}]}}
const desc=(t,l,n)=>{const o=t.n.find(x=>x.id===(l.a===n.id?l.b:l.a));return({c:'cônjuge',i:'irmão(ã)',o:'ligada'}[l.t]||(l.a===n.id?'pai/mãe de':'filho(a) de'))+': '+(o?o.name:'?')};
function org(t){const g={};t.n.forEach(n=>g[n.id]=0);for(let k=0;k<8;k++)t.l.forEach(l=>{if(!g.hasOwnProperty(l.a)||!g.hasOwnProperty(l.b))return;if(l.t==='p')g[l.b]=Math.max(g[l.b],g[l.a]+1);if(l.t==='c')g[l.a]=g[l.b]=Math.max(g[l.a],g[l.b])});
const r={};t.n.forEach(n=>(r[g[n.id]]=r[g[n.id]]||[]).push(n));Object.keys(r).forEach(k=>r[k].forEach((n,i,a)=>{n.x=500+(i-(a.length-1)/2)*170;n.y=80+k*130}))}
function draw(t){const N=id=>t.n.find(x=>x.id===id);let s=t.bgi?`<image href="${t.bgi}" width="1000" height="620" preserveAspectRatio="xMidYMid slice"/>`:'';
t.l.forEach(l=>{const a=N(l.a),b=N(l.b);if(!a||!b)return;const mx=(a.x+b.x)/2;
if(l.t==='p')s+=`<path class="lk" d="M${a.x} ${a.y+32}V${(a.y+b.y)/2}H${b.x}V${b.y-32}"/>`;
else if(l.t==='i')s+=`<path class="lk" d="M${a.x} ${a.y-32}Q${mx} ${Math.min(a.y,b.y)-75} ${b.x} ${b.y-32}"/>`;
else s+=`<path class="lk" d="M${a.x} ${a.y}L${b.x} ${b.y}" ${l.t==='c'?'stroke-dasharray="6 4" style="stroke:var(--accent);stroke-width:2.5"':''}/>${l.t==='c'?`<text x="${mx}" y="${(a.y+b.y)/2-6}" text-anchor="middle" style="font-size:11px">cônjuge</text>`:''}`});
t.n.forEach(n=>{s+=`<g class="nd ${n.id===ns?'on':''}" data-n="${n.id}" transform="translate(${n.x},${n.y})" style="cursor:grab"><rect x="-70" y="-32" width="140" height="64" rx="6"/><clipPath id="k${n.id}"><circle cx="-42" cy="0" r="22"/></clipPath>${n.img?`<image href="${n.img}" x="-64" y="-22" width="44" height="44" clip-path="url(#k${n.id})" preserveAspectRatio="xMidYMid slice"/>`:`<circle cx="-42" cy="0" r="22" style="fill:var(--bg)"/><text x="-42" y="5" text-anchor="middle" style="font-size:16px">${esc(n.name[0]||'?')}</text>`}<text x="-14" y="4">${esc(n.name.length>11?n.name.slice(0,10)+'…':n.name)}</text></g>`});
$('#tw').innerHTML=s}
function panel(t){const n=t.n.find(x=>x.id===ns),p=P();if(!n){$('#np').innerHTML='<p class="small">Clique numa pessoa para editar, ligar ou trocar a imagem. Arraste para mover.</p>';return}
$('#np').innerHTML=`<div class="card"><div class="row" style="align-items:flex-end;gap:.6rem"><label class="small">Nome<br><input type="text" id="nn" value="${esc(n.name)}"></label><button class="btn g" id="ni">Imagem</button><label class="small">Ficha ligada<br><select id="ne"><option value="">Nenhuma</option>${p.es.filter(x=>x.cat==='Personagens').map(x=>`<option value="${x.id}" ${x.id===n.e?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><button class="btn g" id="nd" style="color:var(--bad)">Remover pessoa</button></div>
<div class="row" style="align-items:flex-end;gap:.6rem;margin-top:.7rem"><label class="small">${esc(n.name)} é<br><select id="lt"><option value="c">Cônjuge de</option><option value="p">Pai/Mãe de</option><option value="i">Irmão/Irmã de</option><option value="o">Ligada a</option></select></label><label class="small">Pessoa<br><select id="lb">${t.n.filter(x=>x.id!==n.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><button class="btn" id="lk">Ligar</button></div>
<p>${t.l.filter(l=>l.a===n.id||l.b===n.id).map(l=>`<span class="tag" style="margin-right:.3rem">${esc(desc(t,l,n))} <button data-ul="${l.id}" title="Remover ligação" style="background:none;border:0;color:var(--bad);cursor:pointer">×</button></span>`).join('')}</p></div>`}
function arvore(){const p=P();p.trees=p.trees||[];const t=p.trees.find(x=>x.id===tid)||p.trees[0];tid=t&&t.id;
$('#m').innerHTML=`<div class="row"><div class="side">${p.trees.map(x=>`<button data-t2="${x.id}" ${x.id===tid?'aria-current="true"':''}>${esc(x.name)}</button>`).join('')}<button id="at" style="color:var(--accent)">Nova árvore</button></div><div class="grow">${t?`
<div class="row" style="align-items:flex-end;gap:.6rem;margin-bottom:.6rem"><label class="small">Nome da árvore<br><input type="text" id="tn" value="${esc(t.name)}"></label><label class="small">Fundo<br><input type="color" id="tc" value="${t.bc||'#f8f9f5'}" style="height:34px;width:48px;padding:0"></label><button class="btn g" id="tbg">Imagem de fundo</button><button class="btn g" id="tbx">Limpar fundo</button><button class="btn g" id="tor">Organizar</button><button class="btn g" id="tdel" style="color:var(--bad)">Excluir árvore</button></div>
<div class="row" style="align-items:flex-end;gap:.6rem;margin-bottom:.6rem"><label class="small">Nova pessoa<br><input type="text" id="an" placeholder="Nome"></label><label class="small">ou ficha<br><select id="af2"><option value="">Escolher ficha</option>${p.es.filter(x=>x.cat==='Personagens').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><button class="btn" id="ap2">Adicionar à árvore</button></div>
<svg id="tw" viewBox="0 0 1000 620" width="100%" role="img" aria-label="Árvore ${esc(t.name)}"></svg><div id="np" style="margin-top:.6rem"></div><input type="file" id="fbg" accept="image/*" hidden><input type="file" id="fni" accept="image/*" hidden>`:'<p class="small">Crie uma árvore para cada família do seu mundo. Dá para ligar pessoas, colocar imagens e trocar o fundo.</p>'}</div></div>`;
document.querySelector('.side').onclick=e=>{const b=e.target.closest('button');if(!b)return;ns=null;if(b.dataset.t2){tid=b.dataset.t2;arvore()}if(b.id==='at'){const x={id:uid(),name:'Nova família',bc:'',bgi:'',n:[],l:[]};p.trees.push(x);tid=x.id;save();arvore()}};
if(!t)return;const s=$('#tw'),np=$('#np');let dg=null;s.style.background=t.bc||'var(--panel)';draw(t);panel(t);
const pt=e=>{const q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(s.getScreenCTM().inverse())};
s.onpointerdown=e=>{const g=e.target.closest('.nd');if(!g){if(ns){ns=null;draw(t);panel(t)}return}ns=g.dataset.n;dg=t.n.find(x=>x.id===ns);s.setPointerCapture(e.pointerId);draw(t);panel(t)};
s.onpointermove=e=>{if(!dg)return;const q=pt(e);dg.x=Math.round(Math.max(70,Math.min(930,q.x)));dg.y=Math.round(Math.max(40,Math.min(580,q.y)));draw(t)};
s.onpointerup=()=>{if(dg){dg=null;save()}};
$('#tn').oninput=e=>{t.name=e.target.value;save()};$('#tn').onchange=arvore;
$('#tc').oninput=e=>{t.bc=e.target.value;s.style.background=t.bc;save()};
$('#tbg').onclick=()=>$('#fbg').click();$('#fbg').onchange=async e=>{const f=e.target.files[0];if(f){t.bgi=await shrink(f);save();draw(t)}};
$('#tbx').onclick=()=>{t.bgi='';t.bc='';save();arvore()};
$('#tor').onclick=()=>{org(t);save();draw(t)};
$('#tdel').onclick=()=>{if(confirm('Excluir esta árvore?')){p.trees=p.trees.filter(x=>x!==t);tid=null;save();arvore()}};
$('#ap2').onclick=()=>{const f=p.es.find(x=>x.id===$('#af2').value),nm=f?f.name:$('#an').value.trim();if(!nm)return;const n={id:uid(),x:500,y:100+(t.n.length%4)*40,name:nm,img:f?f.img:'',e:f?f.id:''};t.n.push(n);ns=n.id;save();draw(t);panel(t);$('#an').value=''};
$('#fni').onchange=async e=>{const f=e.target.files[0];e.target.value='';const n=t.n.find(x=>x.id===ns);if(f&&n){n.img=await shrink(f);save();draw(t)}};
np.oninput=e=>{const n=t.n.find(x=>x.id===ns);if(n&&e.target.id==='nn'){n.name=e.target.value;save();draw(t)}};
np.onchange=e=>{const n=t.n.find(x=>x.id===ns);if(n&&e.target.id==='ne'){n.e=e.target.value;const f=p.es.find(x=>x.id===n.e);if(f&&f.img&&!n.img)n.img=f.img;save();draw(t)}};
np.onclick=e=>{const n=t.n.find(x=>x.id===ns),b=e.target.closest('button');if(!b||!n)return;
if(b.id==='ni')$('#fni').click();
if(b.id==='nd'){t.n=t.n.filter(x=>x!==n);t.l=t.l.filter(l=>l.a!==n.id&&l.b!==n.id);ns=null}
if(b.id==='lk'&&$('#lb').value)t.l.push({id:uid(),a:n.id,b:$('#lb').value,t:$('#lt').value});
if(['nd','lk'].includes(b.id)||b.dataset.ul){if(b.dataset.ul)t.l=t.l.filter(l=>l.id!==b.dataset.ul);save();draw(t);panel(t)}}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ch]'),s=e.target.closest('[data-sc]');if(a){cid=a.dataset.ch;ver=a.dataset.v||'final';tab='escrita';render()}if(s){const el=$('#s-'+s.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth'})}});
S.ps.forEach(p=>{p.trees=p.trees||(p.name==='Crônicas de Valdor'&&p.es.length?[demo(p)]:[])});
render();
</script>
</body>
</html>
